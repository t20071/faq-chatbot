<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course FAQ Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,400..800&display=swap" rel="stylesheet">
<style>
  /* Design tokens */
  :root {
    --primary-bg: #F3F3F1;
    --card-bg: #FFFFFF;
    --accent-yellow: #FFDA3C;
    --active-bg: #FFEC8A;
    --border-yellow: #F5C400;
    --navy: #1B3A8C;
    --text-dark: #000000;
    --text-muted: #54595F;
    --rule: #E2E2DE;
    --code-bg: #F3F3F1;
    --error: #C62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --primary-bg: #121418;
      --card-bg: #1C1F25;
      --active-bg: #3A3418;
      --navy: #9DB4F5;
      --text-dark: #F3F3F1;
      --text-muted: #A9ADB5;
      --rule: #2C3038;
      --code-bg: #262A31;
      --error: #FF8A80;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Archivo', system-ui, sans-serif;
    background: var(--primary-bg);
    color: var(--text-dark);
    line-height: 1.6;
    display: flex; flex-direction: column;
    height: 100dvh; overflow-x: hidden;
  }

  /* Top bar */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 24px; background: var(--card-bg); border-bottom: 1px solid var(--rule);
  }
  .brand {
    font-weight: 800; font-stretch: 75%; text-transform: uppercase;
    letter-spacing: .04em; font-size: 18px; color: var(--text-dark);
  }
  .brand span { color: var(--navy); }
  .pill-btn {
    font: inherit; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em;
    background: var(--accent-yellow); color: #000; border: 1px solid var(--border-yellow);
    border-radius: 999px; padding: 8px 18px; cursor: pointer; transition: filter .2s;
  }
  .pill-btn:hover { filter: brightness(.95); }

  /* Hero */
  .hero { padding: 28px 24px 8px; text-align: center; }
  .eyebrow {
    display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .12em;
    text-transform: uppercase; color: var(--navy);
    border-top: 1px solid var(--accent-yellow); border-bottom: 1px solid var(--accent-yellow);
    padding: 6px 28px;
  }
  .hero h1 {
    margin-top: 14px; font-weight: 800; font-stretch: 62%; text-transform: uppercase;
    color: var(--navy); font-size: clamp(34px, 6vw, 56px); line-height: 1;
  }

  /* Course tabs */
  .tabs {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
    padding: 18px 24px 12px; max-width: 960px; margin: 0 auto;
  }
  .tab {
    font: inherit; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    background: transparent; color: var(--text-muted); border: 1px solid var(--rule);
    border-radius: 999px; padding: 7px 16px; cursor: pointer; transition: background .2s, color .2s;
  }
  .tab:hover { color: var(--text-dark); }
  .tab[aria-selected="true"] {
    background: var(--active-bg); color: var(--text-dark); border-color: var(--border-yellow);
  }
  @media (max-width: 640px) {
    .tabs { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; scrollbar-width: none; }
    .tab { flex: 0 0 auto; }
  }

  /* Conversation */
  #log { flex: 1; overflow-y: auto; padding: 8px 16px 24px; }
  .thread { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 88%; overflow-wrap: anywhere; font-size: 15px; }
  .user {
    align-self: flex-end; background: var(--accent-yellow); color: #000;
    padding: 10px 16px; border-radius: 16px 16px 4px 16px; white-space: pre-wrap;
  }
  .assistant {
    align-self: flex-start; background: var(--card-bg); padding: 16px 18px;
    border-left: 3px solid var(--accent-yellow); border-radius: 4px 12px 12px 4px;
    box-shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  .assistant p { margin-bottom: 8px; } .assistant p:last-child { margin-bottom: 0; }
  .assistant pre { background: var(--code-bg); padding: 10px; border-radius: 6px; overflow-x: auto; margin-bottom: 8px; }
  .assistant code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .assistant pre code { padding: 0; }
  .assistant a { color: var(--navy); }
  .label {
    display: block; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    color: var(--navy); margin-bottom: 6px;
  }
  .thinking { color: var(--text-muted); }
  .thinking::after { content: "…"; animation: blink 1s steps(3) infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .error { color: var(--error); border-left-color: var(--error); }

  details { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--rule); font-size: 13px; color: var(--text-muted); }
  summary {
    cursor: pointer; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--text-dark); list-style: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: " →"; }
  details[open] summary::after { content: " ↓"; }
  .searched { margin: 8px 0 4px; font-style: italic; }
  details ul { list-style: none; }
  details li { padding: 6px 0; border-bottom: 1px solid var(--rule); }
  details li:last-child { border-bottom: none; }
  details li b { display: block; color: var(--text-dark); font-weight: 600; }

  /* Empty state: suggestion cards */
  .suggestions { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 14px; margin-top: 8px; }
  .card {
    text-align: left; font: inherit; color: var(--text-dark); background: var(--card-bg);
    border: none; border-bottom: 3px solid transparent; padding: 18px; cursor: pointer;
    display: flex; flex-direction: column; justify-content: space-between; gap: 14px; min-height: 120px;
    box-shadow: 0 1px 2px rgba(0,0,0,.05); transition: border-color .2s, transform .2s;
  }
  .card:hover { border-bottom-color: var(--accent-yellow); transform: translateY(-2px); }
  .card .more { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }

  /* Composer */
  .composer-wrap { background: var(--card-bg); border-top: 1px solid var(--rule); padding: 12px 16px; }
  form { display: flex; gap: 10px; max-width: 820px; margin: 0 auto; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; font: inherit; font-size: 15px; color: var(--text-dark); background: var(--primary-bg);
    border: 1px solid var(--rule); border-radius: 24px; padding: 11px 18px; min-height: 46px; max-height: 160px;
    outline: none; transition: border-color .2s;
  }
  textarea:focus { border-color: var(--border-yellow); }
  #send { height: 46px; padding: 0 22px; }
  #send:disabled { opacity: .5; cursor: default; }
  .hint { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 6px; }

  @media (max-width: 480px) {
    .topbar { padding: 10px 16px; }
    .hero { padding: 18px 16px 4px; }
    .msg { max-width: 94%; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">Course <span>FAQ</span> Assistant</div>
  <button id="reset" class="pill-btn" type="button">New chat</button>
</header>

<main id="log">
  <section class="hero">
    <div class="eyebrow">DataTalksClub Courses</div>
    <h1>Ask the course FAQ</h1>
  </section>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Course"></nav>
  <div class="thread" id="thread"></div>
</main>

<div class="composer-wrap">
  <form id="form">
    <textarea id="input" rows="1" placeholder="Ask a question…" aria-label="Message"></textarea>
    <button id="send" class="pill-btn" type="submit">Send</button>
  </form>
  <p class="hint">Answers come from the course FAQ and may be incomplete.</p>
</div>

<script>
const thread = document.getElementById("thread");
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const tabs = document.getElementById("tabs");

const SUGGESTIONS = [
  "I just discovered the course. Can I still join?",
  "Do I need to pay for an LLM API to do the homework?",
  "How do I get a certificate?",
];
let course = "llm-zoomcamp";
let history = [];

function renderTabs(courses) {
  tabs.innerHTML = "";
  for (const c of courses) {
    const b = document.createElement("button");
    b.className = "tab"; b.type = "button"; b.role = "tab";
    b.textContent = c.name;
    b.setAttribute("aria-selected", String(c.id === course));
    b.addEventListener("click", () => {
      if (c.id === course) return;
      course = c.id;
      tabs.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t === b)));
      reset();
    });
    tabs.appendChild(b);
  }
  // On phones the tabs scroll horizontally; keep the selected one visible.
  const selected = tabs.querySelector('[aria-selected="true"]');
  if (selected) tabs.scrollLeft = selected.offsetLeft - tabs.offsetLeft - 16;
}
renderTabs([{id: "llm-zoomcamp", name: "LLM Zoomcamp"}]);
// Static file from the CDN: showing the courses never waits for the Python function.
fetch("/courses.json").then(r => r.json()).then(renderTabs).catch(() => {});
// Start (warm up) the serverless function now, while the user is still typing.
fetch("/api/warmup").catch(() => {});

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// Minimal markdown: code fences, inline code, bold, links, paragraphs.
function render(md) {
  const parts = md.split(/```[a-zA-Z]*\n?/);
  return parts.map((part, i) => {
    const safe = escapeHtml(part);
    if (i % 2) return `<pre><code>${safe}</code></pre>`;
    return safe.split(/\n{2,}/).filter(p => p.trim()).map(p => "<p>" + p
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\n/g, "<br>") + "</p>").join("");
  }).join("");
}

function emptyState() {
  thread.innerHTML = "";
  const grid = document.createElement("div");
  grid.className = "suggestions";
  for (const q of SUGGESTIONS) {
    const card = document.createElement("button");
    card.className = "card"; card.type = "button";
    card.innerHTML = `<span></span><span class="more">Ask this →</span>`;
    card.firstChild.textContent = q;
    card.addEventListener("click", () => { input.value = q; form.requestSubmit(); });
    grid.appendChild(card);
  }
  thread.appendChild(grid);
}

function addMessage(role, html) {
  thread.querySelector(".suggestions")?.remove();
  const div = document.createElement("div");
  div.className = "msg " + role;
  if (role === "user") div.textContent = html;
  else div.innerHTML = html;
  thread.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function sourcesEl(data) {
  const d = document.createElement("details");
  const s = document.createElement("summary");
  s.textContent = `Sources (${data.sources.length})`;
  d.appendChild(s);
  const q = document.createElement("div");
  q.className = "searched";
  const MODES = {hybrid: "keyword + semantic", bm25: "keyword", vector: "semantic"};
  q.textContent = `Searched for: ${data.standalone_question} · ${MODES[data.search_mode] || data.search_mode} search`;
  d.appendChild(q);
  const ul = document.createElement("ul");
  for (const src of data.sources) {
    const li = document.createElement("li");
    const b = document.createElement("b");
    b.textContent = src.question;
    li.appendChild(b);
    li.appendChild(document.createTextNode(src.section));
    ul.appendChild(li);
  }
  d.appendChild(ul);
  return d;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message || send.disabled) return;
  input.value = ""; input.style.height = "";
  addMessage("user", message);
  send.disabled = true;
  const pending = addMessage("assistant", '<span class="label">Assistant</span><span class="thinking">Searching the FAQ</span>');
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message, history, course}),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    pending.innerHTML = '<span class="label">Assistant</span>' + render(data.answer);
    pending.appendChild(sourcesEl(data));
    history.push({role: "user", content: message}, {role: "assistant", content: data.answer});
  } catch (err) {
    pending.classList.add("error");
    pending.textContent = "Error: " + err.message;
  } finally {
    send.disabled = false;
    log.scrollTop = log.scrollHeight;
    input.focus();
  }
});

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = input.scrollHeight + "px";
});

function reset() {
  history = [];
  emptyState();
  input.focus();
}
document.getElementById("reset").addEventListener("click", reset);
emptyState();
</script>
</body>
</html>
